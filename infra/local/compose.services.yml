# App services. Images are built by Nx: `pnpm nx run-many -t docker:build`.
# `pnpm start` also runs `docker compose watch`: host rebuilds (see scripts/dev-watch.sh)
# are synced into the running containers via `develop.watch`.
# Always combined with compose.infra.yml (see the `compose:local` script).
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-billy}:${POSTGRES_PASSWORD:-billy}@postgres:5432/${POSTGRES_DB:-billy}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-billy}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-billybilly}
  S3_BUCKET: ${S3_BUCKET:-billy-documents}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-20}
  MAX_FILES_PER_BATCH: ${MAX_FILES_PER_BATCH:-20}
  BUSINESS_OWNER_ID: ${BUSINESS_OWNER_ID:-default}
  BUSINESS_WEEK_START: ${BUSINESS_WEEK_START:-monday}
  BUSINESS_CURRENCY: ${BUSINESS_CURRENCY:-USD}
  EXTRACTION_MODEL: ${EXTRACTION_MODEL:-claude-haiku-5-5}
  VISION_MODEL: ${VISION_MODEL:-claude-sonnet-5-5}
  OCR_MIN_CONFIDENCE: ${OCR_MIN_CONFIDENCE:-0.70}
  RECORD_MIN_CONFIDENCE: ${RECORD_MIN_CONFIDENCE:-0.80}
  PROCESSING_COST_LIMIT_USD: ${PROCESSING_COST_LIMIT_USD:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3.5-lite}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  s3:
    condition: service_healthy

services:
  api:
    image: apps-api
    # `build` is only here so `docker compose watch` accepts the service; images are built by Nx (docker:build)
    build:
      context: ../../apps/api
    pull_policy: never
    environment:
      <<: *app-env
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on: *infra-ready
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/api/dist/main.js
          target: /app/main.js

  worker:
    image: apps-worker
    # `build` is only here so `docker compose watch` accepts the service; images are built by Nx (docker:build)
    build:
      context: ../../apps/worker
    pull_policy: never
    environment: *app-env
    depends_on: *infra-ready
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/worker/dist/main.js
          target: /app/main.js

  web:
    image: apps-web
    # `build` is only here so `docker compose watch` accepts the service; images are built by Nx (docker:build)
    build:
      context: ../../apps/web
    pull_policy: never
    environment:
      API_URL: http://api:3000
    ports:
      - '${WEB_PORT:-3001}:3000'
    depends_on:
      - api
    develop:
      watch:
        - action: sync+restart
          path: ../../apps/web/.next/standalone
          target: /app
          ignore:
            - node_modules/
        - action: sync
          path: ../../apps/web/.next/static
          target: /app/apps/web/.next/static
