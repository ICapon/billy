# Backing services (Postgres + pgvector, Redis, S3). Can run on its own for `nx serve` dev.
name: billy-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billy}
      POSTGRES_DB: ${POSTGRES_DB:-billy}
    ports:
      - '${POSTGRES_PORT:-5442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-billy}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. MinIO's community images are no longer published,
  # so we use SeaweedFS (same S3 API/SDK; swap for R2/S3 in staging/prod).
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '${S3_PORT:-9100}:9000'
    volumes:
      - s3-data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 9000']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  s3-data:
