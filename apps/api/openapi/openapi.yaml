openapi: 3.0.0
paths:
  /api:
    get:
      operationId: AppController_getData
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - App
  /api/files:
    post:
      description: Respects MAX_FILE_SIZE_MB per file and MAX_FILES_PER_BATCH files. Valid files are accepted even if others fail. Duplicates are reported per file as outcome=duplicate inside the 207 response unless onDuplicate=keep.
      operationId: FilesController_upload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                onDuplicate:
                  type: string
                  enum:
                    - skip
                    - keep
                  default: skip
                  description: What to do with files already uploaded (same content hash)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
                - files
      responses:
        "207":
          description: Per-file outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponseDto_Output"
      summary: Upload one or more files (multipart)
      tags:
        - files
    get:
      operationId: FilesController_list
      parameters:
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - received
              - queued_limit
              - processing
              - completed
              - needs_review
              - failed
        - name: from
          required: false
          in: query
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: false
          in: query
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 50
            type: integer
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesPageDto_Output"
      summary: List files, newest first
      tags:
        - files
  /api/files/{id}:
    get:
      operationId: FilesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "404":
          description: File not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessFileDetailDto_Output"
      summary: File detail with its extracted records
      tags:
        - files
    delete:
      operationId: FilesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: File not found
      summary: Permanently delete a file, its content and derived records
      tags:
        - files
  /api/files/{id}/download:
    get:
      description: Add ?inline=1 to display it in the browser instead of downloading it.
      operationId: FilesController_download
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: inline
          required: false
          in: query
          schema:
            type: string
            enum:
              - "1"
              - "true"
      responses:
        "200":
          description: File bytes
        "404":
          description: File not found
      summary: Stream the original file
      tags:
        - files
  /api/files/{id}/retry:
    post:
      description: Records the owner already confirmed are kept.
      operationId: FilesController_retry
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "202":
          description: The file was queued again
        "404":
          description: File not found
        "409":
          description: The file is not in a retryable state
      summary: Re-queue a failed or needs-review file for processing
      tags:
        - files
  /api/records:
    get:
      description: Filter by date range, kind, category, file or product name (contains).
      operationId: RecordsController_list
      parameters:
        - name: from
          required: false
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: false
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: kind
          required: false
          in: query
          schema:
            enum:
              - expense
              - income
            type: string
        - name: category
          required: false
          in: query
          schema:
            enum:
              - supplies
              - inventory
              - rent
              - utilities
              - staff
              - transport
              - marketing
              - taxes
              - equipment
              - sales
              - services
              - other
            type: string
        - name: product
          required: false
          in: query
          description: Case-insensitive match on line item product name
          schema:
            minLength: 1
            maxLength: 200
            type: string
        - name: fileId
          required: false
          in: query
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Page size (1-200, default 50)
          schema:
            minimum: 1
            maximum: 200
            default: 50
            type: integer
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsPageDto_Output"
      summary: List records, newest first
      tags:
        - records
  /api/records/totals:
    get:
      description: Per bucket, kind and category, with the confirmed and unconfirmed parts. Excludes records of files in needs_review and merged duplicates. Weeks start on BUSINESS_WEEK_START (Monday by default). Use category=staff for the staff expense breakdown.
      operationId: RecordsController_totals
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: groupBy
          required: true
          in: query
          schema:
            enum:
              - week
              - month
            type: string
        - name: kind
          required: false
          in: query
          schema:
            enum:
              - expense
              - income
            type: string
        - name: category
          required: false
          in: query
          schema:
            enum:
              - supplies
              - inventory
              - rent
              - utilities
              - staff
              - transport
              - marketing
              - taxes
              - equipment
              - sales
              - services
              - other
            type: string
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TotalsRowDto_Output"
      summary: Totals grouped by week or month
      tags:
        - records
  /api/records/products:
    get:
      description: Aggregated by product. Same exclusions as the totals endpoint.
      operationId: RecordsController_products
      parameters:
        - name: direction
          required: true
          in: query
          schema:
            enum:
              - purchase
              - sale
            type: string
        - name: from
          required: false
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: false
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRowDto_Output"
      summary: Purchased or sold products
      tags:
        - records
  /api/records/{id}:
    patch:
      description: When every record of a file in review is confirmed, the file becomes completed.
      operationId: RecordsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdateDto"
      responses:
        "404":
          description: Record not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDto_Output"
      summary: Correct a record; it is marked as confirmed
      tags:
        - records
    delete:
      operationId: RecordsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Record not found
      summary: Delete a record
      tags:
        - records
  /api/records/{id}/confirm:
    post:
      operationId: RecordsController_confirm
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "404":
          description: Record not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDto_Output"
      summary: Confirm a record as extracted
      tags:
        - records
  /api/duplicates:
    get:
      operationId: DuplicatesController_list
      parameters: []
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicateCandidateDto_Output"
      summary: Pairs of records that look like the same transaction
      tags:
        - duplicates
  /api/duplicates/{id}/resolve:
    post:
      description: A merge keeps one record and excludes the other from totals. Nothing is merged without this call.
      operationId: DuplicatesController_resolve
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDuplicateDto"
      responses:
        "204":
          description: Resolved
        "400":
          description: keepTransactionId is not part of the pair
        "404":
          description: Pair not found
        "409":
          description: Pair already resolved
      summary: Keep both records or merge them
      tags:
        - duplicates
  /api/costs/summary:
    get:
      description: Amounts are in micro-USD (1,000,000 = 1 USD). byTier counts files per reading method, so the share read with the cheapest methods is visible.
      operationId: CostsController_summary
      parameters:
        - name: month
          required: false
          in: query
          description: YYYY-MM, defaults to the current month
          schema:
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            type: string
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummaryDto_Output"
      summary: Processing cost for a month and the limit status
      tags:
        - costs
info:
  title: Billy API
  description: "Business file upload, extraction results and queryable records. No authentication in v1: every resource belongs to the single configured business owner."
  version: 0.1.0
  contact: {}
tags:
  - name: files
    description: Upload, list, download, retry and delete business files
  - name: records
    description: Extracted transactions, totals and product lists
  - name: duplicates
    description: Likely duplicate transactions across files
  - name: costs
    description: Processing cost summary and limit status
servers: []
components:
  schemas:
    UploadResponseDto_Output:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              outcome:
                type: string
                enum:
                  - accepted
                  - rejected
                  - duplicate
              reason:
                type:
                  - string
                  - "null"
              file:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  originalName:
                    type: string
                    minLength: 1
                    maxLength: 255
                  mimeType:
                    type: string
                    minLength: 1
                  sizeBytes:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  status:
                    type: string
                    enum:
                      - received
                      - queued_limit
                      - processing
                      - completed
                      - needs_review
                      - failed
                  failureReason:
                    type:
                      - string
                      - "null"
                  readingMethod:
                    type: string
                    enum:
                      - digital
                      - ocr
                      - vision
                      - null
                    nullable: true
                  totalCostMicroUsd:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  duplicateOf:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    nullable: true
                  uploadedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                required:
                  - id
                  - originalName
                  - mimeType
                  - sizeBytes
                  - status
                  - failureReason
                  - readingMethod
                  - totalCostMicroUsd
                  - duplicateOf
                  - uploadedAt
                additionalProperties: false
                nullable: true
              existingFileId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                nullable: true
            required:
              - name
              - outcome
              - reason
              - file
              - existingFileId
            additionalProperties: false
      required:
        - results
      additionalProperties: false
    FilesPageDto_Output:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              originalName:
                type: string
                minLength: 1
                maxLength: 255
              mimeType:
                type: string
                minLength: 1
              sizeBytes:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              status:
                type: string
                enum:
                  - received
                  - queued_limit
                  - processing
                  - completed
                  - needs_review
                  - failed
              failureReason:
                type:
                  - string
                  - "null"
              readingMethod:
                type: string
                enum:
                  - digital
                  - ocr
                  - vision
                  - null
                nullable: true
              totalCostMicroUsd:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              duplicateOf:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                nullable: true
              uploadedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            required:
              - id
              - originalName
              - mimeType
              - sizeBytes
              - status
              - failureReason
              - readingMethod
              - totalCostMicroUsd
              - duplicateOf
              - uploadedAt
            additionalProperties: false
        nextCursor:
          type: array
          items:
            type: string
      required:
        - items
        - nextCursor
      additionalProperties: false
    BusinessFileDetailDto_Output:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        originalName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          type: string
          enum:
            - received
            - queued_limit
            - processing
            - completed
            - needs_review
            - failed
        failureReason:
          type: array
          items:
            type: string
        readingMethod:
          type: string
          enum:
            - digital
            - ocr
            - vision
            - null
          nullable: true
        totalCostMicroUsd:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        duplicateOf:
