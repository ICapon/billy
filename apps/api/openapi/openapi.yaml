openapi: 3.0.0
paths:
  /api:
    get:
      operationId: AppController_getData
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - App
  /api/files:
    post:
      description: Respects MAX_FILE_SIZE_MB per file and MAX_FILES_PER_BATCH files. Valid files are accepted even if others fail. Duplicates are reported per file as outcome=duplicate inside the 207 response unless onDuplicate=keep.
      operationId: FilesController_upload
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                onDuplicate:
                  type: string
                  enum:
                    - skip
                    - keep
                  default: skip
                  description: What to do with files already uploaded (same content hash)
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
                - files
      responses:
        "207":
          description: Per-file outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponseDto_Output"
      summary: Upload one or more files (multipart)
      tags:
        - files
    get:
      operationId: FilesController_list
      parameters:
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - received
              - queued_limit
              - processing
              - completed
              - needs_review
              - failed
        - name: documentType
          required: false
          in: query
          schema:
            anyOf:
              - type: string
                enum:
                  - bank_statement
                  - payroll
                  - invoice
                  - receipt
                  - sales_report
                  - other
              - type: string
                enum:
                  - unclassified
        - name: from
          required: false
          in: query
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: false
          in: query
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 50
            type: integer
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesPageDto_Output"
      summary: List files, newest first
      tags:
        - files
  /api/files/reanalyze/estimate:
    get:
      description: Number of files without a document type and a rough cost (this month's average per file, or a default), with the limit and the budget left.
      operationId: FilesController_reanalyzeEstimate
      parameters:
        - name: scope
          required: true
          in: query
          schema:
            enum:
              - unclassified
            type: string
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReanalyzeEstimateDto_Output"
      summary: Estimate a bulk re-analysis
      tags:
        - files
  /api/files/reanalyze:
    post:
      description: 'Files go through the normal queue, so the monthly cost limit applies: files over the limit wait as "queued_limit".'
      operationId: FilesController_reanalyzeAll
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReanalyzeScopeDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReanalyzeResultDto_Output"
      summary: Re-analyze all files of a scope
      tags:
        - files
  /api/files/{id}:
    get:
      operationId: FilesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "404":
          description: File not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessFileDetailDto_Output"
      summary: File detail with its extracted records
      tags:
        - files
    delete:
      operationId: FilesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: File not found
      summary: Permanently delete a file, its content and derived records
      tags:
        - files
  /api/files/{id}/download:
    get:
      description: Add ?inline=1 to display it in the browser instead of downloading it.
      operationId: FilesController_download
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: inline
          required: false
          in: query
          schema:
            type: string
            enum:
              - "1"
              - "true"
      responses:
        "200":
          description: File bytes
        "404":
          description: File not found
      summary: Stream the original file
      tags:
        - files
  /api/files/{id}/type:
    patch:
      description: Marks the type as chosen by the owner and reads the file again as that type. Confirmed records are kept.
      operationId: FilesController_setType
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFileTypeDto"
      responses:
        "202":
          description: The file was queued again
        "404":
          description: File not found
        "409":
          description: The file is being processed right now
      summary: Correct the document type of a file
      tags:
        - files
  /api/files/{id}/reanalyze:
    post:
      operationId: FilesController_reanalyze
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "202":
          description: The file was queued again
        "404":
          description: File not found
        "409":
          description: The file is already waiting or being processed
      summary: Re-analyze one finished file
      tags:
        - files
  /api/files/{id}/retry:
    post:
      description: Records the owner already confirmed are kept.
      operationId: FilesController_retry
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "202":
          description: The file was queued again
        "404":
          description: File not found
        "409":
          description: The file is not in a retryable state
      summary: Re-queue a failed or needs-review file for processing
      tags:
        - files
  /api/records:
    get:
      description: Filter by date range, kind, category, file or product name (contains).
      operationId: RecordsController_list
      parameters:
        - name: from
          required: false
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: false
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: kind
          required: false
          in: query
          schema:
            enum:
              - expense
              - income
            type: string
        - name: category
          required: false
          in: query
          schema:
            enum:
              - supplies
              - inventory
              - rent
              - utilities
              - staff
              - transport
              - marketing
              - taxes
              - equipment
              - sales
              - services
              - other
            type: string
        - name: product
          required: false
          in: query
          description: Case-insensitive match on line item product name
          schema:
            minLength: 1
            maxLength: 200
            type: string
        - name: fileId
          required: false
          in: query
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: documentType
          required: false
          in: query
          schema:
            enum:
              - bank_statement
              - payroll
              - invoice
              - receipt
              - sales_report
              - other
            type: string
        - name: documentId
          required: false
          in: query
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Page size (1-200, default 50)
          schema:
            minimum: 1
            maximum: 200
            default: 50
            type: integer
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsPageDto_Output"
      summary: List records, newest first
      tags:
        - records
  /api/records/totals:
    get:
      description: Per bucket, kind and category, with the confirmed and unconfirmed parts. Excludes records of files in needs_review and merged duplicates. Weeks start on BUSINESS_WEEK_START (Monday by default). Use category=staff for the staff expense breakdown.
      operationId: RecordsController_totals
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: groupBy
          required: true
          in: query
          schema:
            enum:
              - week
              - month
            type: string
        - name: kind
          required: false
          in: query
          schema:
            enum:
              - expense
              - income
            type: string
        - name: category
          required: false
          in: query
          schema:
            enum:
              - supplies
              - inventory
              - rent
              - utilities
              - staff
              - transport
              - marketing
              - taxes
              - equipment
              - sales
              - services
              - other
            type: string
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TotalsRowDto_Output"
      summary: Totals grouped by week or month
      tags:
        - records
  /api/records/products:
    get:
      description: Aggregated by product. Same exclusions as the totals endpoint.
      operationId: RecordsController_products
      parameters:
        - name: direction
          required: true
          in: query
          schema:
            enum:
              - purchase
              - sale
            type: string
        - name: from
          required: false
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: false
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: limit
          required: false
          in: query
          description: Keep only the N products with the largest totals (1-100)
          schema:
            minimum: 1
            maximum: 100
            type: integer
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRowDto_Output"
      summary: Purchased or sold products
      tags:
        - records
  /api/records/{id}:
    patch:
      description: When every record of a file in review is confirmed, the file becomes completed.
      operationId: RecordsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdateDto"
      responses:
        "404":
          description: Record not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDto_Output"
      summary: Correct a record; it is marked as confirmed
      tags:
        - records
    delete:
      operationId: RecordsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Record not found
      summary: Delete a record
      tags:
        - records
  /api/records/{id}/confirm:
    post:
      operationId: RecordsController_confirm
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "404":
          description: Record not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionDto_Output"
      summary: Confirm a record as extracted
      tags:
        - records
  /api/duplicates:
    get:
      operationId: DuplicatesController_list
      parameters: []
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicateCandidateDto_Output"
      summary: Pairs of records that look like the same transaction
      tags:
        - duplicates
  /api/duplicates/{id}/resolve:
    post:
      description: A merge keeps one record and excludes the other from totals. Nothing is merged without this call.
      operationId: DuplicatesController_resolve
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDuplicateDto"
      responses:
        "204":
          description: Resolved
        "400":
          description: keepTransactionId is not part of the pair
        "404":
          description: Pair not found
        "409":
          description: Pair already resolved
      summary: Keep both records or merge them
      tags:
        - duplicates
  /api/costs/summary:
    get:
      description: Amounts are in micro-USD (1,000,000 = 1 USD). byTier counts files per reading method, so the share read with the cheapest methods is visible.
      operationId: CostsController_summary
      parameters:
        - name: month
          required: false
          in: query
          description: YYYY-MM, defaults to the current month
          schema:
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            type: string
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummaryDto_Output"
      summary: Processing cost for a month and the limit status
      tags:
        - costs
  /api/dashboard/activity:
    get:
      description: Counts the files uploaded inside the period (inclusive UTC dates) by state, with the success rate (completed / finished), the average analysis time and a zero-filled series of uploads and finished analyses, bucketed by day (periods up to 31 days) or week.
      operationId: DashboardController_activity
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
      responses:
        "400":
          description: Missing or malformed dates, or from after to
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummaryDto_Output"
      summary: File activity for a period
      tags:
        - dashboard
  /api/dashboard/attention:
    get:
      description: "Not period based: files in review, failed or waiting for budget, pending duplicate pairs and the unconfirmed amount per currency (same exclusions as the totals)."
      operationId: DashboardController_attention
      parameters: []
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttentionItemsDto_Output"
      summary: Items that need the owner's attention
      tags:
        - dashboard
  /api/documents/bank-statements:
    get:
      description: Included when the statement period ends inside the range (inclusive UTC dates). One entry per currency. Gaps flag an opening balance that differs from the previous closing balance of the same account, or days with no statement in between.
      operationId: DocumentsController_bankStatements
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
      responses:
        "400":
          description: Missing or malformed dates, or from after to
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankStatementsViewDto_Output"
      summary: Bank statements with balances, flows and continuity gaps
      tags:
        - documents
  /api/documents/payroll:
    get:
      description: Included when the pay period ends inside the range (inclusive UTC dates). One entry per currency. The total cost is the employer cost when the document states it, otherwise the gross total, and it is the same amount recorded as a staff expense.
      operationId: DocumentsController_payroll
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
      responses:
        "400":
          description: Missing or malformed dates, or from after to
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollViewDto_Output"
      summary: Payroll totals per pay period
      tags:
        - documents
  /api/documents/payroll/employees/{key}:
    get:
      description: The key is the normalized `employeeKey` returned with the payroll lines.
      operationId: DocumentsController_employeeHistory
      parameters:
        - name: key
          required: true
          in: path
          schema:
            minLength: 1
            maxLength: 200
            type: string
      responses:
        "404":
          description: Unknown employee
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeHistoryDto_Output"
      summary: Pay history of one employee
      tags:
        - documents
  /api/documents/payroll/{documentId}:
    get:
      operationId: DocumentsController_payrollLines
      parameters:
        - name: documentId
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "404":
          description: Document not found or not a payroll
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollLineViewDto_Output"
      summary: Employee lines of one payroll document
      tags:
        - documents
  /api/documents/commercial:
    get:
      description: Included by issue date (inclusive UTC dates). One entry per currency and kind. Taxes count as 0 when a document does not state them; paid and pending only add documents that say so.
      operationId: DocumentsController_commercial
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
      responses:
        "400":
          description: Missing or malformed dates, or from after to
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommercialViewDto_Output"
      summary: "Invoices and receipts: totals, taxes, paid or pending and top counterparties"
      tags:
        - documents
  /api/documents/sales:
    get:
      description: Reports whose period ends inside the range. The series is bucketed by day (ranges up to 31 days) or week. One entry per currency.
      operationId: DocumentsController_sales
      parameters:
        - name: from
          required: true
          in: query
          description: Inclusive start date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - name: to
          required: true
          in: query
          description: Inclusive end date (YYYY-MM-DD)
          schema:
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
      responses:
        "400":
          description: Missing or malformed dates, or from after to
        default:
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesViewDto_Output"
      summary: "Sales reports: total, units, average ticket, best products and sales over time"
      tags:
        - documents
  /api/chat/status:
    get:
      operationId: ChatController_status
      parameters: []
      responses:
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatStatusDto_Output"
      summary: Whether the chat is available, has documents, and example questions
      tags:
        - chat
  /api/chat/conversations:
    get:
      description: Conversations without messages are not listed.
      operationId: ChatController_list
      parameters:
        - name: cursor
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            type: integer
      responses:
        "400":
          description: Invalid query
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationsPageDto_Output"
      summary: List conversations, most recent activity first
      tags:
        - chat
    post:
      operationId: ChatController_create
      parameters: []
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDto_Output"
      summary: Start a new, empty conversation
      tags:
        - chat
  /api/chat/conversations/{id}:
    get:
      operationId: ChatController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "404":
          description: Conversation not found
        default:
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetailDto_Output"
      summary: A conversation with its messages, oldest first
      tags:
        - chat
    delete:
      operationId: ChatController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Conversation not found
      summary: Delete a conversation and its messages
      tags:
        - chat
  /api/chat/conversations/{id}/messages:
    post:
      description: Stores the question, answers from the analyzed documents and lists the documents used. If the answer fails the question is kept; sending the same text again reuses it.
      operationId: ChatController_send
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResultDto_Output"
        "400":
          description: Empty or too long message
        "404":
          description: Conversation not found
        "429":
          description: Rate limited; see the Retry-After header
        "502":
          description: The model failed or timed out
        "503":
          description: Chat is not configured
      summary: Ask a question and get the answer
      tags:
        - chat
info:
  title: Billy API
  description: "Business file upload, extraction results and queryable records. No authentication in v1: every resource belongs to the single configured business owner."
  version: 0.1.0
  contact: {}
tags:
  - name: files
    description: Upload, list, download, retry and delete business files
  - name: records
    description: Extracted transactions, totals and product lists
  - name: duplicates
    description: Likely duplicate transactions across files
  - name: costs
    description: Processing cost summary and limit status
  - name: dashboard
    description: File activity and pending items for the dashboard
  - name: documents
    description: "Metrics per document type: bank statements, payroll, invoices, sales"
  - name: chat
    description: Questions about the analyzed documents, as conversations
servers: []
components:
  schemas:
    UploadResponseDto_Output:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              outcome:
                type: string
                enum:
                  - accepted
                  - rejected
                  - duplicate
              reason:
                type:
                  - string
                  - "null"
              file:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  originalName:
                    type: string
                    minLength: 1
                    maxLength: 255
                  mimeType:
                    type: string
                    minLength: 1
                  sizeBytes:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  status:
                    type: string
                    enum:
                      - received
                      - queued_limit
                      - processing
                      - completed
                      - needs_review
                      - failed
                  failureReason:
                    type:
                      - string
                      - "null"
                  readingMethod:
                    type: string
                    enum:
                      - digital
                      - ocr
                      - vision
                      - null
                    nullable: true
                  totalCostMicroUsd:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  duplicateOf:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    nullable: true
                  documentType:
                    type: string
                    enum:
                      - bank_statement
                      - payroll
                      - invoice
                      - receipt
                      - sales_report
                      - other
                      - null
                    nullable: true
                  documentTypeConfidence:
                    type: number
                    minimum: 0
                    maximum: 1
                    nullable: true
                  documentTypeManual:
                    type: boolean
                  uploadedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                required:
                  - id
                  - originalName
                  - mimeType
                  - sizeBytes
                  - status
                  - failureReason
                  - readingMethod
                  - totalCostMicroUsd
                  - duplicateOf
                  - documentType
                  - documentTypeConfidence
                  - documentTypeManual
                  - uploadedAt
                additionalProperties: false
                nullable: true
              existingFileId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                nullable: true
            required:
              - name
              - outcome
              - reason
              - file
              - existingFileId
            additionalProperties: false
      required:
        - results
      additionalProperties: false
    FilesPageDto_Output:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              originalName:
                type: string
                minLength: 1
                maxLength: 255
              mimeType:
                type: string
                minLength: 1
              sizeBytes:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              status:
                type: string
                enum:
                  - received
                  - queued_limit
                  - processing
                  - completed
                  - needs_review
                  - failed
              failureReason:
                type:
                  - string
                  - "null"
              readingMethod:
                type: string
                enum:
                  - digital
                  - ocr
                  - vision
                  - null
                nullable: true
              totalCostMicroUsd:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              duplicateOf:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                nullable: true
              documentType:
                type: string
                enum:
                  - bank_statement
                  - payroll
                  - invoice
                  - receipt
                  - sales_report
                  - other
                  - null
                nullable: true
              documentTypeConfidence:
                type: number
                minimum: 0
                maximum: 1
                nullable: true
              documentTypeManual:
                type: boolean
              uploadedAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
            required:
              - id
              - originalName
              - mimeType
              - sizeBytes
              - status
              - failureReason
              - readingMethod
              - totalCostMicroUsd
              - duplicateOf
              - documentType
              - documentTypeConfidence
              - documentTypeManual
              - uploadedAt
            additionalProperties: false
        nextCursor:
          type: array
          items:
            type: string
      required:
        - items
        - nextCursor
      additionalProperties: false
    ReanalyzeEstimateDto_Output:
      type: object
      properties:
        files:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        estimatedMicroUsd:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        limitMicroUsd:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          nullable: true
        remainingMicroUsd:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          nullable: true
      required:
        - files
        - estimatedMicroUsd
        - limitMicroUsd
        - remainingMicroUsd
      additionalProperties: false
    ReanalyzeScopeDto:
      type: object
      properties:
        scope:
          type: string
          enum:
            - unclassified
      required:
        - scope
    ReanalyzeResultDto_Output:
      type: object
      properties:
        queued:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - queued
      additionalProperties: false
    BusinessFileDetailDto_Output:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        originalName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        status:
          type: string
          enum:
            - received
            - queued_limit
            - processing
            - completed
            - needs_review
            - failed
        failureReason:
          type: array
          items:
            type: string
        readingMethod:
          type: string
          enum:
            - digital
            - ocr
            - vision
            - null
          nullable: true
        totalCostMicroUsd:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        duplicateOf:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          nullable: true
        documentType:
          type: string
          enum:
            - bank_statement
            - payroll
            - invoice
            - receipt
            - sales_report
            - other
            - null
          nullable: true
        documentTypeConfidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        documentTypeManual:
          type: boolean
        uploadedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        records:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              fileId:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              occurredOn:
                type: string
                format: date
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
              amountMinor:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              currency:
                type: string
                pattern: ^[A-Z]{3}$
              kind:
                type: string
                enum:
                  - expense
                  - income
              category:
                type: string
                enum:
                  - supplies
                  - inventory
                  - rent
                  - utilities
                  - staff
                  - transport
                  - marketing
                  - taxes
                  - equipment
                  - sales
                  - services
                  - other
              isStaff:
                type: boolean
              counterparty:
                type: string
                maxLength: 200
                nullable: true
              confidence:
                type: number
                minimum: 0
                maximum: 1
              confirmed:
                type: boolean
              excludedReason:
                type: string
                enum:
                  - merged_duplicate
                  - null
                nullable: true
              lineItems:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    productName:
                      type: string
                      minLength: 1
                      maxLength: 200
                    quantity:
